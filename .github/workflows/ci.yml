name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (test, lint, architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: "domain layer coverage (design §7.6, target >=95%)"
        run: pytest --cov=real_chart_bench.domain --cov-report=term-missing --cov-fail-under=95 tests/domain -q

      - name: ruff (lint)
        run: ruff check .

      - name: import-linter (clean architecture dependency direction)
        run: lint-imports
