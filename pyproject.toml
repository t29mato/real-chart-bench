[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "real-chart-bench"
version = "0.0.1"
description = "An open benchmark for chart data extraction from real, open-access research figures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "t29mato" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pymupdf>=1.24",
]

[project.scripts]
real-chart-bench = "real_chart_bench.infrastructure.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/real_chart_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# notebooks/ are self-contained Colab-run scratch notebooks (design §7.19),
# not library code -- excluded from the lint gate the same way generated/
# vendored code would be. Their imports and style are Colab's, not this repo's.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.importlinter]
root_package = "real_chart_bench"

[[tool.importlinter.contracts]]
name = "Clean architecture layers (infrastructure -> adapter -> usecase -> domain)"
type = "layers"
layers = [
    "real_chart_bench.infrastructure",
    "real_chart_bench.adapter",
    "real_chart_bench.usecase",
    "real_chart_bench.domain",
]
